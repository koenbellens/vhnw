<!DOCTYPE html>
<html lang="nl" translate="no">
<head>
<meta charset="utf-8">
<meta name="google" content="notranslate">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VHNW &mdash; Kiosk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#070a10; --txt:#e6edf6; --muted:#7d8da3; --accent:#16c784;
    --danger:#f6465d; --warn:#f0a500;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{background:var(--bg);color:var(--txt);font-family:Inter,system-ui,sans-serif;
       overflow:hidden;cursor:none;
       background-image:radial-gradient(circle at 18% -10%,rgba(22,199,132,.12),transparent 42%),
                        radial-gradient(circle at 88% 0%,rgba(45,212,191,.10),transparent 38%),
                        radial-gradient(circle at 50% 120%,rgba(22,199,132,.08),transparent 45%);}

  /* bouncend logo (DVD-stijl) */
  #logo{position:fixed;top:0;left:0;z-index:1;will-change:transform;
        font-family:Orbitron,sans-serif;font-weight:900;font-size:54px;letter-spacing:3px;
        color:var(--accent);text-shadow:0 0 24px currentColor;opacity:.85;user-select:none;
        padding:10px 18px;border:3px solid currentColor;border-radius:16px}

  /* voorgrond: stats */
  .stage{position:fixed;inset:0;z-index:2;display:flex;flex-direction:column;
         align-items:center;justify-content:center;text-align:center;padding:4vh 3vw;pointer-events:none}
  .top{position:fixed;top:3vh;left:0;right:0;display:flex;align-items:center;justify-content:center;gap:18px}
  .brand{font-family:Orbitron,sans-serif;font-weight:700;letter-spacing:2px;font-size:clamp(20px,3vw,34px)}
  .brand small{display:block;font-family:Inter;font-weight:400;color:var(--muted);
               font-size:clamp(10px,1vw,14px);letter-spacing:1px}
  .badge{display:inline-flex;align-items:center;gap:10px;padding:8px 18px;border-radius:999px;
         font-weight:600;font-size:clamp(13px,1.4vw,18px);border:1px solid #1e2a3a;background:#121823cc}
  .dot{width:13px;height:13px;border-radius:50%;background:var(--muted)}
  .dot.run{background:var(--accent);box-shadow:0 0 14px var(--accent)}
  .dot.err{background:var(--danger);box-shadow:0 0 14px var(--danger)}
  .dot.wait{background:var(--warn);box-shadow:0 0 14px var(--warn)}

  .hero{display:flex;flex-direction:column;align-items:center;gap:2px;margin-bottom:5vh}
  .hr{font-family:Orbitron,sans-serif;font-weight:900;line-height:1;
      font-size:clamp(60px,16vw,220px);
      background:linear-gradient(180deg,#22e39a,#0f9e6a);-webkit-background-clip:text;
      background-clip:text;-webkit-text-fill-color:transparent;
      filter:drop-shadow(0 0 26px rgba(22,199,132,.35))}
  .hr-unit{font-family:Orbitron,sans-serif;font-weight:700;color:var(--muted);
           font-size:clamp(18px,3vw,40px);letter-spacing:2px;margin-top:-.4em}

  .stats{display:flex;flex-wrap:wrap;gap:clamp(14px,2.5vw,40px);justify-content:center}
  .stat{min-width:130px}
  .stat .k{color:var(--muted);font-size:clamp(11px,1.1vw,15px);text-transform:uppercase;letter-spacing:1px}
  .stat .v{font-family:Orbitron,sans-serif;font-weight:700;font-size:clamp(26px,4vw,58px);margin-top:6px}
  .v.hot{color:var(--danger)} .v.warm{color:var(--warn)}
  .pool{margin-top:4vh;color:var(--muted);font-size:clamp(12px,1.3vw,18px)}
  .pool b{color:var(--txt);font-weight:600}
</style>
</head>
<body>
<div id="logo">VHNW</div>

<div class="top">
  <div class="brand">VHNW<small>Van Hash Naar Winst</small></div>
  <div class="badge"><span id="dot" class="dot"></span><span id="state">verbinden&hellip;</span></div>
</div>

<div class="stage">
  <div class="hero">
    <div class="hr"><span id="hr">0</span></div>
    <div class="hr-unit"><span id="hrunit">H/s</span></div>
  </div>
  <div class="stats">
    <div class="stat"><div class="k">Shares (goed)</div><div class="v" id="shares">0</div></div>
    <div class="stat"><div class="k">Temperatuur</div><div class="v" id="temp">&mdash;</div></div>
    <div class="stat"><div class="k">Mining-tijd</div><div class="v" id="uptime">&mdash;</div></div>
    <div class="stat"><div class="k">Herstarts</div><div class="v" id="restarts">0</div></div>
  </div>
  <div class="pool">Apparaat <b id="host">&mdash;</b> &middot; Pool <b id="pool">&mdash;</b> &middot; XMRig <b id="ver">&mdash;</b></div>
</div>

<script>
"use strict";
const $ = (id) => document.getElementById(id);
const COLORS = ["#16c784","#2dd4bf","#f0a500","#f6465d","#8b5cf6","#38bdf8"];

/* ---- bouncend logo ---- */
const logo = $("logo");
let x = 60, y = 120, vx = 2.1, vy = 1.7, ci = 0;
function tick(){
  const w = window.innerWidth, h = window.innerHeight;
  const lw = logo.offsetWidth, lh = logo.offsetHeight;
  x += vx; y += vy;
  let hit = false;
  if (x <= 0){ x = 0; vx = Math.abs(vx); hit = true; }
  else if (x + lw >= w){ x = w - lw; vx = -Math.abs(vx); hit = true; }
  if (y <= 0){ y = 0; vy = Math.abs(vy); hit = true; }
  else if (y + lh >= h){ y = h - lh; vy = -Math.abs(vy); hit = true; }
  if (hit){ ci = (ci + 1) % COLORS.length; logo.style.color = COLORS[ci]; }
  logo.style.transform = `translate(${x}px,${y}px)`;
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);

/* ---- stats ophalen ---- */
function fmtHr(v){
  if (!v || v <= 0) return {n:"0",u:"H/s"};
  if (v >= 1000) return {n:(v/1000).toFixed(2),u:"kH/s"};
  return {n:v.toFixed(1),u:"H/s"};
}
function fmtUptime(secs){
  const d=Math.floor(secs/86400),h=Math.floor((secs%86400)/3600),m=Math.floor((secs%3600)/60);
  if(d>0)return `${d}d ${h}u`;
  if(h>0)return `${h}u ${m}m`;
  return `${m}m`;
}
async function poll(){
  try{
    const r = await fetch("/api/status");
    const s = await r.json();
    render(s);
  }catch(e){
    $("state").textContent = "geen verbinding";
    $("dot").className = "dot err";
  }
}
function render(s){
  const m = s.miner || {}, sum = s.summary, sys = s.system || {};
  let cls="dot", label=m.state||"onbekend";
  if(m.state==="actief")cls="dot run";
  else if(m.state==="fout")cls="dot err";
  else if(m.state==="herstarten"||m.state==="bezig met starten")cls="dot wait";
  $("dot").className = cls;
  $("state").textContent = label;

  const hr = fmtHr(sum ? sum.hashrate_now : 0);
  $("hr").textContent = hr.n;
  $("hrunit").textContent = hr.u;
  $("shares").textContent = sum ? sum.shares_good : 0;
  $("restarts").textContent = m.restart_count || 0;
  $("uptime").textContent = m.running_secs ? fmtUptime(m.running_secs) : "—";
  $("host").textContent = sys.hostname || "—";
  $("pool").textContent = (sum && sum.pool) ? sum.pool : "—";
  $("ver").textContent = (sum && sum.version) ? sum.version : "—";

  const t = sys.temp_c;
  const tEl = $("temp");
  if(t){
    tEl.textContent = t.toFixed(1) + "°";
    tEl.className = "v" + (t >= 85 ? " hot" : t >= 75 ? " warm" : "");
  }else{
    tEl.textContent = "—"; tEl.className = "v";
  }
}
poll();
setInterval(poll, 2000);
</script>
</body>
</html>
